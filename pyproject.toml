[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numagent"
version = "0.1.0"
description = "An agentic harness for building and testing numerical repositories."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
# Phase 2: the LLM agent (Anthropic + OpenAI providers, .env token loading)
agent = ["anthropic>=0.40", "openai>=1.40", "python-dotenv>=1.0"]
# NumBugMiner: PR ingestion + RAG numerical-bug classification. DeepSeek needs
# nothing further — its OpenAI-compatible endpoint is called over `requests`.
miner = ["anthropic>=0.40", "requests>=2.28", "numpy>=1.23", "pydantic>=2.0"]
# Optional dense-retrieval backend; without it the miner falls back to TF-IDF.
miner-embed = ["sentence-transformers>=2.2"]
# `numbugminer probe`: document-RAG over a repo cloned at the buggy commit.
# openai is used both as a generation provider and for embeddings; Ollama needs
# only a running server (HTTP); Anthropic + offline use the TF-IDF fallback.
probe = ["anthropic>=0.40", "openai>=1.40", "requests>=2.28", "numpy>=1.23"]
# Read SWE-bench .parquet files for `numbugminer swebench` (a .jsonl source, or
# the HF datasets-server JSON API, needs nothing extra).
swebench = ["pyarrow>=12"]

[project.scripts]
numagent = "numagent.cli:main"
numbugminer = "numbugminer.cli:main"

[tool.setuptools.packages.find]
include = ["numagent*", "numbugminer*"]
